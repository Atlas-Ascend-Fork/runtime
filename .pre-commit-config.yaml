repos:
  - repo: https://gitcode.com/pre-commit-clang/mirrors-clang-format
    rev: v16.0.0
    hooks:
      - id: clang-format
        types_or: [c++, c]
        files: \.(c|h|cpp|hpp|cc|hh|cxx|hxx)$
        exclude: |
          (?x)^(
            pkg_inc/profiling/aprof_pub\.h$
            |include/external/acl/(?:
              acl_prof
              | acl_rt
              | acl_rt_allocator
              | acl_tdt
              | acl_tdt_queue
            )\.h$
          )
        args:
          - "--style=file"
          - "--verbose"
          - "-i"


  # OAT compliance check (Open Source Audit Tool)
  - repo: https://gitcode.com/HiAgent/compliance
    rev: v1.0.6
    hooks:
      - id: oat-check
        exclude: '^(\.pre-commit-config\.yaml|README\.md|\.devcontainer/Dockerfile|Third_Party_Open_Source_Software_List\.yaml|.*help\.info|docs/figures/runtime-assistant-wechat\.jpg)$'
        pass_filenames: true
        stages: [pre-commit]
        verbose: true
